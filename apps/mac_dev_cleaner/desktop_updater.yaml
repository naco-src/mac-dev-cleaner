# desktop_updater publish config (see https://pub.dev/packages/desktop_updater).
# Feed is the `updates` branch on GitHub (raw URLs preserve nested release paths).
updates:
  baseUrl: https://raw.githubusercontent.com/naco-src/mac-dev-cleaner/updates
  channel: stable
  output: dist/desktop_updater

customCommand:
  command: ../../tool/macos/desktop-updater-upload-github.sh
