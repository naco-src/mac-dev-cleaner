name: Release

# Manually build macOS (self-hosted MYRUNNER) and/or Linux (ubuntu-latest)
# packages. Toggle publish_macos / publish_linux when dispatching.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag. Leave blank for v<CalVer>+<build> from tool/release-version.sh."
        required: false
        type: string
      release_name:
        description: "Release title. Defaults to “Mac Dev Cleaner · {tag}”."
        required: false
        type: string
      notes:
        description: "Release notes body. Leave blank to generate from commits since the previous v* tag."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release."
        required: false
        type: boolean
        default: false
      publish_macos:
        description: "Build unsigned macOS arm64 + x64 (.zip and .dmg)."
        required: false
        type: boolean
        default: true
      publish_linux:
        description: "Build Linux desktop packages (ubuntu-latest)."
        required: false
        type: boolean
        default: false
      linux_tarball:
        description: "Linux asset: tarball of the Flutter bundle."
        required: false
        type: boolean
        default: true
      linux_deb:
        description: "Linux asset: .deb (amd64)."
        required: false
        type: boolean
        default: false
      linux_appimage:
        description: "Linux asset: AppImage (x86_64)."
        required: false
        type: boolean
        default: false
      publish_in_app_update:
        description: "Publish desktop_updater feed (macOS only; requires publish_macos)."
        required: false
        type: boolean
        default: false
      mandatory_update:
        description: "When publishing the in-app update, mark it mandatory (default is optional)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve metadata
    runs-on: [self-hosted, macOS, MYRUNNER]
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      version_name: ${{ steps.meta.outputs.version_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      deb_version: ${{ steps.meta.outputs.deb_version }}
      flutter_version: ${{ steps.meta.outputs.flutter_version }}
    steps:
      - name: Validate platform inputs
        run: |
          set -euo pipefail
          if [ "${{ inputs.publish_macos }}" != "true" ] \
            && [ "${{ inputs.publish_linux }}" != "true" ]; then
            echo "Enable publish_macos and/or publish_linux."
            exit 1
          fi
          if [ "${{ inputs.publish_in_app_update }}" = "true" ] \
            && [ "${{ inputs.publish_macos }}" != "true" ]; then
            echo "In-app update publish requires publish_macos."
            exit 1
          fi

      - name: Reset workspace before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"
          case "${ws}" in
            "/"*"/_work/"*) ;;
            *) exit 0 ;;
          esac
          if [ -d "${ws}/.git" ]; then
            git -C "${ws}" sparse-checkout disable 2>/dev/null || true
          fi
          find "${ws}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 0

      - name: Resolve build metadata
        id: meta
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if [ ! -f ./tool/release-version.sh ] || [ ! -f ./.fvmrc ]; then
            echo "Checkout missing tool/release-version.sh or .fvmrc"
            ls -la
            exit 1
          fi
          eval "$(./tool/release-version.sh)"
          flutter_version=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc | head -n1)
          tag="${INPUT_TAG}"
          if [ -z "${tag}" ]; then
            tag="${TAG}"
          fi
          if [ -n "${INPUT_RELEASE_NAME}" ]; then
            release_name="${INPUT_RELEASE_NAME}"
          else
            release_name="Mac Dev Cleaner · ${tag}"
          fi
          {
            echo "version_name=${BUILD_NAME}"
            echo "build_number=${BUILD_NUMBER}"
            echo "deb_version=${DEB_VERSION}"
            echo "flutter_version=${flutter_version}"
            echo "tag=${tag}"
            echo "release_name=${release_name}"
          } >> "$GITHUB_OUTPUT"
          echo "CalVer (build-name): ${BUILD_NAME}"
          echo "Build number: ${BUILD_NUMBER}"
          echo "Flutter (from .fvmrc): ${flutter_version}"
          echo "Release tag: ${tag}"

      - name: Write release notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if [ -n "${INPUT_NOTES}" ]; then
            printf '%s\n' "${INPUT_NOTES}" > "${RUNNER_TEMP}/release-notes.txt"
          else
            chmod +x tool/ci/generate-release-notes.sh
            tool/ci/generate-release-notes.sh "${TAG}" > "${RUNNER_TEMP}/release-notes.txt"
          fi
          echo "Release notes preview:"
          head -n 40 "${RUNNER_TEMP}/release-notes.txt"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refreshing notes"
            gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/release-notes.txt"
            exit 0
          fi
          gh release create "${TAG}" \
            --title "${RELEASE_NAME}" \
            --draft \
            --notes-file "${RUNNER_TEMP}/release-notes.txt"

      - name: Delete workspace from disk
        if: always()
        uses: ./.github/actions/cleanup-self-hosted-workspace

  build_macos:
    name: Build macOS
    needs: meta
    if: ${{ inputs.publish_macos }}
    runs-on: [self-hosted, macOS, MYRUNNER]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Reset workspace before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"
          case "${ws}" in
            "/"*"/_work/"*) ;;
            *) exit 0 ;;
          esac
          if [ -d "${ws}/.git" ]; then
            git -C "${ws}" sparse-checkout disable 2>/dev/null || true
          fi
          find "${ws}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Export FVM CLI
        run: |
          echo "MDC_FLUTTER=fvm flutter" >> "$GITHUB_ENV"

      - name: Build and package macOS (arm64 + x64)
        env:
          BUILD_NAME: ${{ needs.meta.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
          TAG: ${{ needs.meta.outputs.tag }}
          OUT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          chmod +x tool/macos/*.sh tool/release-version.sh
          tool/macos/package-release-assets.sh

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x tool/ci/gh-release-upload.sh
          tool/ci/gh-release-upload.sh "${TAG}" "mac-dev-cleaner-${TAG}-macos-*"

      - name: Publish release for desktop_updater validation
        if: ${{ inputs.publish_in_app_update }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "In-app update publish cannot use GitHub pre-releases (releases/latest/download excludes them)."
            echo "Disable Pre-release or disable Publish in-app update. See docs/DEVELOPMENT.md."
            exit 1
          fi
          gh release edit "${TAG}" --draft=false --prerelease=false

      - name: Publish desktop_updater feed (arm64, GitHub Release)
        if: ${{ inputs.publish_in_app_update }}
        env:
          BUILD_NAME: ${{ needs.meta.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
          TAG: ${{ needs.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          DESKTOP_UPDATER_KEY_BUNDLE_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_PASSPHRASE }}
          DESKTOP_UPDATER_MANDATORY: ${{ inputs.mandatory_update }}
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_BASE64 }}" ]; then
            echo "Skipping desktop_updater publish: set DESKTOP_UPDATER_KEY_BUNDLE_BASE64 and DESKTOP_UPDATER_KEY_BUNDLE_PASSPHRASE."
            exit 1
          fi
          bundle="${RUNNER_TEMP}/desktop-updater-release-key.dukey"
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_BASE64 }}" | base64 --decode > "${bundle}"
          export DESKTOP_UPDATER_KEY_BUNDLE_PATH="${bundle}"
          export MACOS_ARCH=arm64
          export STAGE_DIR="${GITHUB_WORKSPACE}/.macos-staging/arm64"
          chmod +x tool/macos/publish-desktop-updater.sh
          tool/macos/publish-desktop-updater.sh

      - name: Delete workspace from disk
        if: always()
        uses: ./.github/actions/cleanup-self-hosted-workspace

  build_linux:
    name: Build Linux
    needs: meta
    if: ${{ inputs.publish_linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Validate Linux format inputs
        run: |
          set -euo pipefail
          if [ "${{ inputs.linux_tarball }}" != "true" ] \
            && [ "${{ inputs.linux_appimage }}" != "true" ] \
            && [ "${{ inputs.linux_deb }}" != "true" ]; then
            echo "publish_linux is true but linux_tarball, linux_appimage, and linux_deb are all false."
            exit 1
          fi

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          packages=(clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev)
          if [ "${{ inputs.linux_deb }}" = "true" ]; then
            packages+=(dpkg-dev imagemagick)
          fi
          if [ "${{ inputs.linux_appimage }}" = "true" ]; then
            packages+=(libfuse2 file wget patchelf imagemagick)
          fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/default/bin" >> "$GITHUB_PATH"

      - name: Install FVM Flutter SDK (.fvmrc)
        run: fvm install

      - name: Build and package Linux
        env:
          BUILD_NAME: ${{ needs.meta.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
          TAG: ${{ needs.meta.outputs.tag }}
          OUT_DIR: ${{ github.workspace }}
          MDC_FLUTTER: fvm flutter
          LINUX_TARBALL: ${{ inputs.linux_tarball }}
          LINUX_DEB: ${{ inputs.linux_deb }}
          LINUX_APPIMAGE: ${{ inputs.linux_appimage }}
          LINUX_PACKAGING_CACHE: ${{ github.workspace }}/.cache/linux-packaging
        run: |
          set -euo pipefail
          chmod +x tool/linux/package-release-assets.sh \
            apps/mac_dev_cleaner/tool/linux/*.sh \
            tool/release-version.sh
          tool/linux/package-release-assets.sh

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x tool/ci/gh-release-upload.sh
          tool/ci/gh-release-upload.sh "${TAG}" \
            "mac-dev-cleaner-${TAG}-linux-*" \
            "mac-dev-cleaner_*.deb"

  github_release:
    name: Publish GitHub Release
    needs: [meta, build_macos, build_linux]
    if: >-
      ${{
        !cancelled()
        && (needs.build_macos.result == 'success' || needs.build_macos.result == 'skipped')
        && (needs.build_linux.result == 'success' || needs.build_linux.result == 'skipped')
        && (
          needs.build_macos.result == 'success'
          || needs.build_linux.result == 'success'
        )
      }}
    runs-on: [self-hosted, macOS, MYRUNNER]
    permissions:
      contents: write
    steps:
      - name: Reset workspace before checkout
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:?}"
          case "${ws}" in
            "/"*"/_work/"*) ;;
            *) exit 0 ;;
          esac
          if [ -d "${ws}/.git" ]; then
            git -C "${ws}" sparse-checkout disable 2>/dev/null || true
          fi
          find "${ws}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout CI scripts
        uses: actions/checkout@v5
        with:
          clean: true
          sparse-checkout: tool/ci
          sparse-checkout-cone-mode: false

      - name: Finalize GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_NAME: ${{ needs.meta.outputs.release_name }}
        run: |
          set -euo pipefail
          args=(
            release edit "${TAG}"
            --draft=false
            --title "${RELEASE_NAME}"
          )
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--prerelease=false)
          fi
          gh "${args[@]}"
          gh release view "${TAG}" --json assets --jq '.assets | length'

      - name: Delete workspace from disk
        if: always()
        run: bash tool/ci/cleanup-self-hosted-workspace.sh
